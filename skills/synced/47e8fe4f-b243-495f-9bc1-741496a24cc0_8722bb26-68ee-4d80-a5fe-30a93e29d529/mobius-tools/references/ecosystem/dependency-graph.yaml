# Mobius Platform Dependency Graph
# This is the authoritative cross-repo dependency map.
# Per-repo AGENTS.md frontmatter should match this file.
# Run: scripts/validate-graph.sh to check for drift.
#
# Generated: 2026-07-16
# Maintained by: mobius-tools (ecosystem SDK)

version: "1.0"
org: boatsgroup

# Tier definitions:
#   core          - ArgoCD hub and Crossplane composition factory
#   infrastructure - Bootstrap (Terragrunt) and Terraform modules (IRSA, monitoring)
#   gitops        - GitOps deployment repos (addons, observability) - NEW tier
#   xrd           - KCL-based Crossplane XRD composition repos
#   utility       - Developer tooling and shared resources
#   application   - Application services (web apps, APIs, lambdas) deployed on the platform
#   meta          - This SDK repo itself

repos:
  iac-eks-argocd:
    role: "ArgoCD control plane hub — manages all EKS cluster addons via hub-spoke"
    tier: core
    github: "boatsgroup/iac-eks-argocd"
    key_docs:
      - CLAUDE.md
    dependencies:
      - iac-eks-addons
      - iac-eks-observability
      - iac-eks-crossplane

